<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="only light">
  <meta name="darkreader-lock">
  <title>Mou Donut House — สั่งสำเร็จ (360px)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="mockup.css">
</head>
<body>
  <div class="screen">
    <header class="brand">
      <span class="brand-name">Mou Donut House</span>
      <span class="brand-sub">ร้านโดนัทของเรา</span>
    </header>

    <main>
      <section class="success-panel" aria-labelledby="success-title">
        <h1 id="success-title">สั่งสำเร็จแล้ว</h1>
        <p>กรุณามารับและชำระเงินที่ร้าน</p>
      </section>

      <section class="order-card" aria-labelledby="order-title">
        <p class="order-label" id="order-title">เลขออเดอร์</p>
        <p class="order-no">MD-2481</p>
        <p class="order-help">เก็บหน้านี้ไว้แสดงที่ร้าน</p>
        <div class="total-line">
          <span>ยอดรวม</span>
          <span>125 บาท</span>
        </div>
      </section>

      <button class="button primary" type="button">กลับไปหน้าเมนู</button>
    </main>
  </div>
</body>
</html>
