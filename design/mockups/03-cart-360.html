<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="only light">
  <meta name="darkreader-lock">
  <title>Mou Donut House — ตะกร้าและยืนยัน (360px)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="mockup.css">
</head>
<body>
  <div class="screen">
    <header class="brand">
      <span class="brand-name">Mou Donut House</span>
      <span class="brand-sub">ร้านโดนัทของเรา</span>
    </header>

    <main>
      <a class="back-link" href="02-menu-360.html">กลับไปเลือกของ</a>
      <h1>ตะกร้าของคุณ</h1>
      <p class="lead">ตรวจรายการให้ครบ แล้วกดยืนยันการสั่งซื้อ</p>

      <article class="cart-item">
        <div class="cart-item-head">
          <h2>โดนัทน้ำตาล</h2>
          <span class="price">35 บาท</span>
        </div>
        <div class="qty-row">
          <button class="button secondary qty-button" type="button" aria-label="ลดจำนวน โดนัทน้ำตาล">
            <span aria-hidden="true">−</span> ลด
          </button>
          <span class="qty-value" aria-label="จำนวน 2">2</span>
          <button class="button secondary qty-button" type="button" aria-label="เพิ่มจำนวน โดนัทน้ำตาล">
            <span aria-hidden="true">+</span> เพิ่ม
          </button>
        </div>
        <p class="line-total">รวม 70 บาท</p>
      </article>

      <article class="cart-item">
        <div class="cart-item-head">
          <h2>ชาไทยเย็น</h2>
          <span class="price">55 บาท</span>
        </div>
        <div class="qty-row">
          <button class="button secondary qty-button" type="button" aria-label="ลดจำนวน ชาไทยเย็น">
            <span aria-hidden="true">−</span> ลด
          </button>
          <span class="qty-value" aria-label="จำนวน 1">1</span>
          <button class="button secondary qty-button" type="button" aria-label="เพิ่มจำนวน ชาไทยเย็น">
            <span aria-hidden="true">+</span> เพิ่ม
          </button>
        </div>
        <p class="line-total">รวม 55 บาท</p>
      </article>

      <section class="total-panel" aria-label="ยอดรวมทั้งหมด">
        <p>ยอดรวมทั้งหมด</p>
        <p class="total">125 บาท</p>
      </section>

      <section class="pay-note" aria-labelledby="pay-title">
        <h2 id="pay-title">ชำระเงินที่หน้าร้าน</h2>
        <p>เมื่อรับสินค้าแล้ว กรุณาจ่ายเงินกับพนักงาน</p>
      </section>

      <div class="confirm-stack">
        <button class="button primary" type="button">ยืนยันการสั่งซื้อ</button>
      </div>
    </main>
  </div>
</body>
</html>
