<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="only light">
  <meta name="darkreader-lock">
  <title>Mou Donut House — เมนู (360px)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="mockup.css">
</head>
<body>
  <div class="screen menu-screen">
    <header class="brand">
      <span class="brand-name">Mou Donut House</span>
      <span class="brand-sub">ร้านโดนัทของเรา</span>
    </header>

    <main>
      <h1>เลือกของที่ชอบ</h1>
      <p class="lead">แตะ “เพิ่ม” ที่รายการที่ต้องการ</p>

      <section aria-labelledby="donuts-title">
        <h2 class="section-title" id="donuts-title">โดนัท</h2>

        <article class="product">
          <div class="product-media">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <circle cx="50" cy="52" r="36" fill="#D99A5B"/>
              <circle cx="50" cy="52" r="16" fill="#FFF6F2"/>
              <path d="M22 42c8-14 20-20 28-20s20 6 28 20c-6 6-14 8-28 8s-22-2-28-8Z" fill="#8E1B3A"/>
              <circle cx="38" cy="38" r="2.5" fill="#FFF6F2"/>
              <circle cx="58" cy="35" r="2.5" fill="#FFF6F2"/>
              <circle cx="66" cy="46" r="2.5" fill="#FFF6F2"/>
              <circle cx="32" cy="48" r="2.5" fill="#FFF6F2"/>
            </svg>
          </div>
          <div class="product-info">
            <h3>โดนัทน้ำตาล</h3>
            <p class="price">35 บาท</p>
          </div>
          <button class="button primary" type="button">เพิ่ม</button>
        </article>

        <article class="product">
          <div class="product-media">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <circle cx="50" cy="52" r="36" fill="#D99A5B"/>
              <circle cx="50" cy="52" r="16" fill="#FFF6F2"/>
              <path d="M22 42c8-14 20-20 28-20s20 6 28 20c-6 6-14 8-28 8s-22-2-28-8Z" fill="#4A2C1D"/>
              <circle cx="38" cy="38" r="2.5" fill="#F2C14E"/>
              <circle cx="58" cy="35" r="2.5" fill="#FFF6F2"/>
              <circle cx="66" cy="46" r="2.5" fill="#F2C14E"/>
              <circle cx="32" cy="48" r="2.5" fill="#FFF6F2"/>
            </svg>
          </div>
          <div class="product-info">
            <h3>โดนัทช็อกโกแลต</h3>
            <p class="price">39 บาท</p>
          </div>
          <button class="button primary" type="button">เพิ่ม</button>
        </article>

        <article class="product sold-out">
          <div class="product-media">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <circle cx="50" cy="52" r="36" fill="#B9AEA7"/>
              <circle cx="50" cy="52" r="16" fill="#EFE7E1"/>
              <path d="M22 42c8-14 20-20 28-20s20 6 28 20c-6 6-14 8-28 8s-22-2-28-8Z" fill="#8F857F"/>
            </svg>
          </div>
          <div class="product-info">
            <h3>โดนัทสตรอว์เบอร์รี</h3>
            <p class="price">39 บาท</p>
          </div>
          <p class="help">หมดชั่วคราว</p>
          <button class="button disabled" type="button" disabled>เพิ่มไม่ได้</button>
        </article>
      </section>

      <section aria-labelledby="drinks-title">
        <h2 class="section-title" id="drinks-title">เครื่องดื่ม</h2>

        <article class="product">
          <div class="product-media">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <path d="M30 28h40l-4 58c-.5 6-5 9-16 9s-15.5-3-16-9l-4-58Z" fill="#D98C4A"/>
              <rect x="26" y="22" width="48" height="10" rx="4" fill="#2A1712"/>
              <rect x="46" y="8" width="8" height="18" rx="4" fill="#8E1B3A"/>
              <path d="M36 40h28l-2 24c-.4 5-4 8-12 8s-11.6-3-12-8l-2-24Z" fill="#F3D3B0" opacity=".55"/>
            </svg>
          </div>
          <div class="product-info">
            <h3>ชาไทยเย็น</h3>
            <p class="price">55 บาท</p>
          </div>
          <button class="button primary" type="button">เพิ่ม</button>
        </article>

        <article class="product">
          <div class="product-media">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <path d="M30 28h40l-4 58c-.5 6-5 9-16 9s-15.5-3-16-9l-4-58Z" fill="#F3D3B0"/>
              <rect x="26" y="22" width="48" height="10" rx="4" fill="#2A1712"/>
              <rect x="46" y="8" width="8" height="18" rx="4" fill="#8E1B3A"/>
              <path d="M34 38h32l-2 30c-.4 5-4 8-14 8s-13.6-3-14-8l-2-30Z" fill="#6B4226"/>
            </svg>
          </div>
          <div class="product-info">
            <h3>กาแฟเย็น</h3>
            <p class="price">65 บาท</p>
          </div>
          <button class="button primary" type="button">เพิ่ม</button>
        </article>

        <article class="product">
          <div class="product-media">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <path d="M34 26h32l-3 56c-.3 5-4 8-13 8s-12.7-3-13-8l-3-56Z" fill="#D9E8F0"/>
              <rect x="30" y="20" width="40" height="9" rx="4" fill="#2A1712"/>
              <rect x="46" y="10" width="8" height="14" rx="4" fill="#8E1B3A"/>
            </svg>
          </div>
          <div class="product-info">
            <h3>น้ำเปล่า</h3>
            <p class="price">20 บาท</p>
          </div>
          <button class="button primary" type="button">เพิ่ม</button>
        </article>
      </section>
    </main>

    <div class="cart-bar">
      <button class="button primary cart-button" type="button" aria-label="ดูตะกร้า 3 ชิ้น ยอดรวม 125 บาท">
        <span>ดูตะกร้า · 3 ชิ้น</span>
        <span>125 บาท</span>
      </button>
    </div>
  </div>
</body>
</html>
